[workspace]
members = [
  ".",
  "crates/snapfzz-core",
  "crates/snapfzz-tauri-shell",
  "crates/snapfzz-plugin-host",
  "crates/snapfzz-plugin-bridge",
  "crates/snapfzz-budget",
  "crates/snapfzz-agent-supervisor",
  "crates/snapfzz-stream-pipeline",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"

[package]
name = "snapfzz"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "Snapfzz"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
reqwest = { version = "0.12", features = ["stream", "json"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
sysinfo = "0.38"
rfd = "0.15"
snapfzz-budget = { path = "crates/snapfzz-budget" }
dashmap = "6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]
