[workspace]
members = [
  ".",
  "crates/snapfzz-plugin-bridge",
  "crates/snapfzz-stream",
  "crates/snapfzz-kernel",
  "crates/snapfzz-vault",
  "crates/snapfzz-packs",
  "crates/snapfzz-llm",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"

[package]
name = "snapfzz"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "Snapfzz"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "test"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
rfd = "0.15"
snapfzz-kernel = { path = "crates/snapfzz-kernel" }
snapfzz-stream = { path = "crates/snapfzz-stream" }
snapfzz-vault = { path = "crates/snapfzz-vault" }
snapfzz-packs = { path = "crates/snapfzz-packs" }
snapfzz-llm = { path = "crates/snapfzz-llm" }
shellexpand = "3.1.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
async-trait = "0.1"
tar = "0.4"
bzip2 = "0.5"

[features]
custom-protocol = ["tauri/custom-protocol"]
