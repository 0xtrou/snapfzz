[package]
name = "snapfzz-kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sysinfo = "0.38"
dashmap = "6"
reqwest = { version = "0.12", features = ["json"] }
dirs = "6"
snapfzz-budget = { path = "../snapfzz-budget" }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
