[package]
name = "snapfzz-llm"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
snapfzz-vault = { path = "../snapfzz-vault" }

[dev-dependencies]
tempfile = "3"
