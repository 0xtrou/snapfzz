[package]
name = "snapfzz-llm"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
snapfzz-vault = { path = "../snapfzz-vault" }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
