[package]
name = "snapfzz-budget"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { version = "1", features = ["sync", "time"] }
sysinfo = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", features = ["json"] }
dashmap = "6"
dirs = "6"
