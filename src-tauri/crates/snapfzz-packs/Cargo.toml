[package]
name = "snapfzz-packs"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full", "process"] }
futures = "0.3"
sha1 = "0.10"
tar = "0.4"
bzip2 = "0.5"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
thiserror = "2"
dirs = "6"

[dev-dependencies]
tempfile = "3"