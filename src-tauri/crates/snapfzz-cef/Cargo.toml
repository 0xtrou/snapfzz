[package]
name = "snapfzz-cef"
version = "0.1.0"
edition = "2021"

[dependencies]
snapfzz-kernel = { path = "../snapfzz-kernel" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"
sha1 = "0.10"
thiserror = "2"
base64 = "0.22"
async-trait = "0.1"
tar = "0.4"
bzip2 = "0.5"

cef-rs = { package = "cef", git = "https://github.com/tauri-apps/cef-rs", branch = "dev", optional = true }
dirs = "6"

[features]
default = []
real-cef = ["dep:cef-rs"]

[dev-dependencies]
tempfile = "3"
