[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snapfzz-name"
version = "0.1.0"
description = "Name intelligence backend"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/name"]

[project.scripts]
name = "name.cli:main"
