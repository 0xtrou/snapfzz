[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snapfzz-orchestrator"
version = "0.1.0"
description = "Snapfzz Intelligence Orchestrator — lean FastAPI wrapper over QwenPaw"
# Per A013/C1: Python range matches QwenPaw's own constraint (>=3.10,<3.14).
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
dependencies = [
    # Per A013/C1: Pin QwenPaw — verified on PyPI (8.6MB source, Apache-2.0).
    # Install bare, not qwenpaw[whisper] / [local] / [full], to avoid heavy deps.
    "qwenpaw==1.1.2",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.40.0"]
rag = ["psycopg2-binary>=2.9.0", "pgvector>=0.3.0", "sqlalchemy>=2.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[project.scripts]
orchestrator = "orchestrator.cli:main"
