[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snapfzz-orchestrator"
version = "0.1.0"
description = "Snapfzz Intelligence Orchestrator — multi-agent runtime forked from QwenPaw"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
]

# Full dependencies (uncomment when QwenPaw extraction is complete)
# "agentscope>=1.0.18",
# "agentscope-runtime>=1.1.3",
# "remelight>=0.1.0",

[project.optional-dependencies]
browser = ["playwright>=1.40.0"]
rag = ["psycopg2-binary>=2.9.0", "pgvector>=0.3.0", "sqlalchemy>=2.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[project.scripts]
orchestrator = "orchestrator.cli:main"
