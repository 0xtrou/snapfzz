name: Coverage Badges

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-badges:
    name: Update Coverage Badges
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-badges-${{ hashFiles('src-tauri/Cargo.lock') }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Run Rust coverage
        working-directory: src-tauri
        run: |
          mkdir -p ../.badges
          for crate in snapfzz-kernel snapfzz-stream; do
            cargo llvm-cov test -p "$crate" --lib --json --output-path "/tmp/${crate}-cov.json" 2>/dev/null || true
            if [ -f "/tmp/${crate}-cov.json" ]; then
              COV=$(python3 -c "
          import json
          d = json.load(open('/tmp/${crate}-cov.json'))
          t = d['data'][0]['totals']['lines']
          print(f'{t[\"covered\"]/t[\"count\"]*100:.1f}' if t['count'] > 0 else '0')
          ")
              COLOR="red"
              if python3 -c "import sys; sys.exit(0 if float('${COV}') >= 90 else 1)"; then COLOR="brightgreen"; fi
              if python3 -c "import sys; sys.exit(0 if 80 <= float('${COV}') < 90 else 1)"; then COLOR="yellow"; fi
              BADGE_NAME=$(echo "$crate" | sed 's/snapfzz-//')
              echo "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"${COV}%\",\"color\":\"${COLOR}\"}" > "../.badges/${BADGE_NAME}.json"
            fi
          done

      - name: Run coverage for all plugins
        run: |
          mkdir -p .badges
          for plugin in chat settings-general settings-performance settings-plugins settings-advanced settings-processes; do
            DIR="plugins/$plugin"
            if [ "$plugin" = "chat" ]; then
              FILTER="@snapfzz/chat-plugin"
            else
              FILTER="@snapfzz/$plugin"
            fi
            pnpm --filter "$FILTER" exec npx vitest run --coverage --coverage.reporter=json-summary 2>/dev/null || true
            SUMMARY="$DIR/coverage/coverage-summary.json"
            if [ -f "$SUMMARY" ]; then
              COV=$(node -e "console.log(require('./$SUMMARY').total.lines.pct)")
              COLOR="red"
              if [ "$(echo "$COV >= 90" | bc)" = "1" ]; then COLOR="brightgreen"; fi
              if [ "$(echo "$COV >= 80" | bc)" = "1" ] && [ "$(echo "$COV < 90" | bc)" = "1" ]; then COLOR="yellow"; fi
              echo "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"${COV}%\",\"color\":\"${COLOR}\"}" > ".badges/$plugin.json"
            fi
          done

      - name: Commit badge data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .badges/
          git diff --staged --quiet || git commit -m "ci: update coverage badges [skip ci]"
          git push
