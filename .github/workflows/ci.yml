name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-tests:
    name: Rust Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Kernel crate tests with coverage
        run: cargo llvm-cov test -p snapfzz-kernel --lib --json --output-path kernel-cov.json
        working-directory: src-tauri
      - name: Assert kernel coverage ≥90%
        working-directory: src-tauri
        run: |
          LINE_PCT=$(python3 -c "
          import json
          d = json.load(open('kernel-cov.json'))
          totals = d['data'][0]['totals']
          lines = totals['lines']
          pct = (lines['covered'] / lines['count'] * 100) if lines['count'] > 0 else 0
          print(f'{pct:.2f}')
          ")
          echo "snapfzz-kernel line coverage: ${LINE_PCT}%"
          python3 -c "import sys; sys.exit(0 if float('${LINE_PCT}') >= 90 else 1)"
      - name: Stream crate tests with coverage
        run: cargo llvm-cov test -p snapfzz-stream --lib --json --output-path stream-cov.json
        working-directory: src-tauri
      - name: Assert stream coverage ≥90%
        working-directory: src-tauri
        run: |
          LINE_PCT=$(python3 -c "
          import json
          d = json.load(open('stream-cov.json'))
          totals = d['data'][0]['totals']
          lines = totals['lines']
          pct = (lines['covered'] / lines['count'] * 100) if lines['count'] > 0 else 0
          print(f'{pct:.2f}')
          ")
          echo "snapfzz-stream line coverage: ${LINE_PCT}%"
          python3 -c "import sys; sys.exit(0 if float('${LINE_PCT}') >= 90 else 1)"
      - name: Main binary tests
        run: cargo test --bin Snapfzz
        working-directory: src-tauri

  frontend-core:
    name: Frontend Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @snapfzz/plugin-host exec npx vitest run

  plugin-chat:
    name: Chat Plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @snapfzz/chat-plugin exec npx vitest run --coverage --coverage.reporter=json-summary
      - name: Assert coverage
        run: |
          COV=$(node -e "console.log(require('./plugins/chat/coverage/coverage-summary.json').total.lines.pct)")
          echo "Chat: ${COV}%"
          node -e "if (${COV} < 90) process.exit(1)"

  plugin-settings:
    name: Settings Plugins
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin: [settings-general, settings-performance, settings-plugins, settings-advanced, settings-processes]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: Test with coverage
        run: pnpm --filter @snapfzz/${{ matrix.plugin }} exec npx vitest run --coverage --coverage.reporter=json-summary
      - name: Assert ≥90% coverage
        run: |
          SUMMARY="plugins/${{ matrix.plugin }}/coverage/coverage-summary.json"
          if [ -f "$SUMMARY" ]; then
            COV=$(node -e "console.log(require('./$SUMMARY').total.lines.pct)")
            echo "${{ matrix.plugin }}: ${COV}%"
            node -e "if (${COV} < 90) { console.error('Coverage ${COV}% < 90%'); process.exit(1); }"
          else
            echo "No coverage report found — tests passed without coverage"
          fi
