name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-crates:
    name: Rust — ${{ matrix.crate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [snapfzz-kernel, snapfzz-packs, snapfzz-vault, snapfzz-llm, snapfzz-cef, snapfzz-stream]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-llvm-cov
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/llvm-cov-target
          key: ${{ runner.os }}-llvm-cov-${{ matrix.crate }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-llvm-cov-${{ matrix.crate }}-
      - name: Install cargo-llvm-cov
        run: command -v cargo-llvm-cov || cargo install cargo-llvm-cov --locked
      - name: Test with coverage
        run: cargo llvm-cov test -p ${{ matrix.crate }} --lib --json --output-path cov.json
        working-directory: src-tauri
      - name: Assert coverage ≥90% (lines + functions)
        working-directory: src-tauri
        run: |
          python3 -c "
          import json, sys
          d = json.load(open('cov.json'))
          t = d['data'][0]['totals']
          lines = t['lines']['covered'] / t['lines']['count'] * 100 if t['lines']['count'] > 0 else 0
          funcs = t['functions']['covered'] / t['functions']['count'] * 100 if t['functions']['count'] > 0 else 0
          print(f'${{ matrix.crate }}: lines={lines:.1f}% functions={funcs:.1f}%')
          if lines < 90 or funcs < 90:
              print(f'FAIL: lines={lines:.1f}% funcs={funcs:.1f}% (need ≥90% each)')
              sys.exit(1)
          "

  rust-binary:
    name: Rust — main binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-bin-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bin-
      - name: Main binary tests
        run: cargo test --bin Snapfzz
        working-directory: src-tauri

  frontend-packages:
    name: Frontend Packages
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [shared, plugin-sdk, plugin-host, launcher, project, preferences]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: Test with coverage
        run: pnpm --filter @snapfzz/${{ matrix.package }} exec npx vitest run --coverage --coverage.reporter=json-summary
      - name: Assert ≥90% overall coverage (lines + branches + functions)
        run: |
          SUMMARY="frontend/packages/${{ matrix.package }}/coverage/coverage-summary.json"
          if [ -f "$SUMMARY" ]; then
            node -e "
              const s = require('./$SUMMARY').total;
              const lines = s.lines.pct;
              const branches = s.branches.pct;
              const functions = s.functions.pct;
              console.log('${{ matrix.package }}: lines=' + lines + '% branches=' + branches + '% functions=' + functions + '%');
              if (lines < 90 || branches < 90 || functions < 90) {
                console.error('FAIL: need ≥90% on lines + branches + functions');
                process.exit(1);
              }
            "
          else
            echo "ERROR: No coverage report found — test suite may have failed"
            exit 1
          fi

  plugin-chat:
    name: Chat Plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @snapfzz/chat-plugin exec npx vitest run --coverage --coverage.reporter=json-summary
      - name: Assert ≥90% overall coverage (lines + branches + functions)
        run: |
          SUMMARY="plugins/chat/coverage/coverage-summary.json"
          if [ -f "$SUMMARY" ]; then
            node -e "
              const s = require('./$SUMMARY').total;
              const lines = s.lines.pct;
              const branches = s.branches.pct;
              const functions = s.functions.pct;
              console.log('chat: lines=' + lines + '% branches=' + branches + '% functions=' + functions + '%');
              if (lines < 90 || branches < 90 || functions < 90) {
                console.error('FAIL: need ≥90% on lines + branches + functions');
                process.exit(1);
              }
            "
          else
            echo "ERROR: No coverage report found — test suite may have failed"
            exit 1
          fi

  plugin-settings:
    name: Settings Plugins
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin: [settings-general, settings-llm, settings-performance, settings-plugins, settings-advanced, settings-processes, settings-vault, settings-components, settings-diagnostics]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: Test with coverage
        run: pnpm --filter @snapfzz/${{ matrix.plugin }} exec npx vitest run --coverage --coverage.reporter=json-summary
      - name: Assert ≥90% overall coverage (lines + branches + functions)
        run: |
          SUMMARY="plugins/${{ matrix.plugin }}/coverage/coverage-summary.json"
          if [ -f "$SUMMARY" ]; then
            node -e "
              const s = require('./$SUMMARY').total;
              const lines = s.lines.pct;
              const branches = s.branches.pct;
              const functions = s.functions.pct;
              console.log('${{ matrix.plugin }}: lines=' + lines + '% branches=' + branches + '% functions=' + functions + '%');
              if (lines < 90 || branches < 90 || functions < 90) {
                console.error('FAIL: need ≥90% on lines + branches + functions');
                process.exit(1);
              }
            "
          else
            echo "ERROR: No coverage report found — test suite may have failed"
            exit 1
          fi
