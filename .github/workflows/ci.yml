name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-tests:
    name: Rust Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Budget crate tests
        run: cargo test -p snapfzz-budget
        working-directory: src-tauri
      - name: Main binary tests
        run: cargo test --bin Snapfzz
        working-directory: src-tauri

  frontend-core:
    name: Frontend Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @snapfzz/plugin-host exec npx vitest run

  plugin-chat:
    name: Chat Plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @snapfzz/chat-plugin exec npx vitest run --coverage --coverage.reporter=json-summary
      - name: Assert coverage
        run: |
          COV=$(node -e "console.log(require('./plugins/chat/coverage/coverage-summary.json').total.lines.pct)")
          echo "Chat: ${COV}%"
          node -e "if (${COV} < 90) process.exit(1)"

  plugin-settings:
    name: Settings Plugins
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin: [settings-general, settings-runtime, settings-performance, settings-plugins, settings-advanced, settings-processes]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @snapfzz/${{ matrix.plugin }} exec npx vitest run
