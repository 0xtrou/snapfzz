name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-tests:
    name: Rust Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Kernel crate tests with coverage
        run: cargo llvm-cov test -p snapfzz-kernel --lib --json --output-path kernel-cov.json
        working-directory: src-tauri
      - name: Assert kernel coverage ≥90% (lines + functions)
        working-directory: src-tauri
        run: |
          python3 -c "
          import json, sys
          d = json.load(open('kernel-cov.json'))
          t = d['data'][0]['totals']
          lines = t['lines']['covered'] / t['lines']['count'] * 100 if t['lines']['count'] > 0 else 0
          funcs = t['functions']['covered'] / t['functions']['count'] * 100 if t['functions']['count'] > 0 else 0
          print(f'snapfzz-kernel: lines={lines:.1f}% functions={funcs:.1f}%')
          if lines < 90 or funcs < 90:
              print(f'FAIL: lines={lines:.1f}% funcs={funcs:.1f}% (need ≥90% each)')
              sys.exit(1)
          "
      - name: Stream crate tests with coverage
        run: cargo llvm-cov test -p snapfzz-stream --lib --json --output-path stream-cov.json
        working-directory: src-tauri
      - name: Assert stream coverage ≥90% (lines + functions)
        working-directory: src-tauri
        run: |
          python3 -c "
          import json, sys
          d = json.load(open('stream-cov.json'))
          t = d['data'][0]['totals']
          lines = t['lines']['covered'] / t['lines']['count'] * 100 if t['lines']['count'] > 0 else 0
          funcs = t['functions']['covered'] / t['functions']['count'] * 100 if t['functions']['count'] > 0 else 0
          print(f'snapfzz-stream: lines={lines:.1f}% functions={funcs:.1f}%')
          if lines < 90 or funcs < 90:
              print(f'FAIL: lines={lines:.1f}% funcs={funcs:.1f}% (need ≥90% each)')
              sys.exit(1)
          "
      - name: Main binary tests
        run: cargo test --bin Snapfzz
        working-directory: src-tauri

  frontend-packages:
    name: Frontend Packages
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [shared, plugin-sdk, plugin-host, launcher, project, preferences]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: Test with coverage
        run: pnpm --filter @snapfzz/${{ matrix.package }} exec npx vitest run --coverage --coverage.reporter=json-summary
      - name: Assert ≥90% overall coverage (lines + branches + functions)
        run: |
          SUMMARY="frontend/packages/${{ matrix.package }}/coverage/coverage-summary.json"
          if [ -f "$SUMMARY" ]; then
            node -e "
              const s = require('./$SUMMARY').total;
              const lines = s.lines.pct;
              const branches = s.branches.pct;
              const functions = s.functions.pct;
              console.log('${{ matrix.package }}: lines=' + lines + '% branches=' + branches + '% functions=' + functions + '%');
              if (lines < 90 || branches < 90 || functions < 90) {
                console.error('FAIL: need ≥90% on lines + branches + functions');
                process.exit(1);
              }
            "
          else
            echo "ERROR: No coverage report found — test suite may have failed"
            exit 1
          fi

  plugin-chat:
    name: Chat Plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @snapfzz/chat-plugin exec npx vitest run --coverage --coverage.reporter=json-summary
      - name: Assert ≥90% overall coverage (lines + branches + functions)
        run: |
          SUMMARY="plugins/chat/coverage/coverage-summary.json"
          if [ -f "$SUMMARY" ]; then
            node -e "
              const s = require('./$SUMMARY').total;
              const lines = s.lines.pct;
              const branches = s.branches.pct;
              const functions = s.functions.pct;
              console.log('chat: lines=' + lines + '% branches=' + branches + '% functions=' + functions + '%');
              if (lines < 90 || branches < 90 || functions < 90) {
                console.error('FAIL: need ≥90% on lines + branches + functions');
                process.exit(1);
              }
            "
          else
            echo "ERROR: No coverage report found — test suite may have failed"
            exit 1
          fi

  plugin-settings:
    name: Settings Plugins
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin: [settings-general, settings-performance, settings-plugins, settings-advanced, settings-processes]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: Test with coverage
        run: pnpm --filter @snapfzz/${{ matrix.plugin }} exec npx vitest run --coverage --coverage.reporter=json-summary
      - name: Assert ≥90% overall coverage (lines + branches + functions)
        run: |
          SUMMARY="plugins/${{ matrix.plugin }}/coverage/coverage-summary.json"
          if [ -f "$SUMMARY" ]; then
            node -e "
              const s = require('./$SUMMARY').total;
              const lines = s.lines.pct;
              const branches = s.branches.pct;
              const functions = s.functions.pct;
              console.log('${{ matrix.plugin }}: lines=' + lines + '% branches=' + branches + '% functions=' + functions + '%');
              if (lines < 90 || branches < 90 || functions < 90) {
                console.error('FAIL: need ≥90% on lines + branches + functions');
                process.exit(1);
              }
            "
          else
            echo "ERROR: No coverage report found — test suite may have failed"
            exit 1
          fi
